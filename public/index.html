<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Support Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: linear-gradient(135deg, #ff6b35, #f7c59f);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #ff6b35, #e63946);
      padding: 20px 25px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 45px;
      height: 45px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header p { font-size: 13px; opacity: 0.85; margin-top: 2px; }
    .online-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
    }
    #chat { 
      height: 420px; 
      overflow-y: auto; 
      padding: 20px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
    .user { 
      display: flex;
      justify-content: flex-end;
    }
    .user span { 
      background: linear-gradient(135deg, #ff6b35, #e63946);
      color: white; 
      padding: 10px 16px; 
      border-radius: 18px 18px 4px 18px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(255,107,53,0.3);
    }
    .agent {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    .agent-avatar {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #ff6b35, #e63946);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .agent span { 
      background: white;
      color: #333;
      padding: 10px 16px; 
      border-radius: 18px 18px 18px 4px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .input-area {
      padding: 16px 20px;
      background: white;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
    }
    input { 
      flex: 1; 
      padding: 12px 16px; 
      border: 2px solid #eee;
      border-radius: 25px; 
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #ff6b35; }
    button { 
      padding: 12px 22px; 
      background: linear-gradient(135deg, #ff6b35, #e63946);
      color: white; 
      border: none; 
      border-radius: 25px; 
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(255,107,53,0.4);
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,107,53,0.5); }
    button:active { transform: translateY(0); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-icon">🍕</div>
      <div>
        <h1 id="shop-title">Support Chat</h1>
        <p><span class="online-dot"></span>Online — Antwortet sofort</p>
      </div>
    </div>
    <div id="chat">
      <div class="agent">
        <div class="agent-avatar">🍕</div>
        <span>Hallo! Herzlich willkommen! Wie kann ich dir helfen? 😊</span>
      </div>
    </div>
    <div class="input-area">
      <input id="input" type="text" placeholder="Schreib eine Nachricht..." onkeydown="if(event.key==='Enter')send()" />
      <button onclick="send()">Senden ➤</button>
    </div>
  </div>
  <script>
    const sessionId = Math.random().toString(36).substring(2);
    fetch('/config').then(r => r.json()).then(c => {
      document.getElementById('shop-title').textContent = c.name + ' Support';
    });
    async function send() {
      const input = document.getElementById('input');
      const chat = document.getElementById('chat');
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      chat.innerHTML += `<div class="user"><span>${message}</span></div>`;
      chat.innerHTML += `<div class="agent" id="loading"><div class="agent-avatar">🍕</div><span>...</span></div>`;
      chat.scrollTop = chat.scrollHeight;
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message, sessionId })
      });
      const data = await res.json();
      document.getElementById('loading').remove();
      chat.innerHTML += `<div class="agent"><div class="agent-avatar">🍕</div><span>${data.reply}</span></div>`;
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
