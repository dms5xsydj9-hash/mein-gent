<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Pizza Mannheim Support</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: linear-gradient(135deg, #e8001c 0%, #ffffff 50%, #009246 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 600px;
      overflow: hidden;
    }
    .italian-stripe {
      height: 5px;
      background: linear-gradient(to right, #009246 33%, #ffffff 33%, #ffffff 66%, #e8001c 66%);
    }
    .header {
      background: #e8001c;
      padding: 18px 25px;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; opacity: 0.9; margin-top: 3px; }
    .online-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 5px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    #chat { 
      height: 420px; 
      overflow-y: auto; 
      padding: 20px;
      background: #f8f9fa;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
    .user { display: flex; justify-content: flex-end; }
    .user span { 
      background: #e8001c;
      color: white; 
      padding: 10px 16px; 
      border-radius: 18px 18px 4px 18px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(232,0,28,0.3);
    }
    .agent { display: flex; gap: 8px; align-items: flex-end; }
    .agent-avatar {
      width: 34px; height: 34px;
      background: #009246;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }
    .agent span { 
      background: white;
      color: #333;
      padding: 10px 16px; 
      border-radius: 18px 18px 18px 4px;
      max-width: 75%;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .typing span {
      display: inline-block;
      width: 7px; height: 7px;
      background: #999;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    .input-area {
      padding: 14px 20px;
      background: white;
      border-top: 3px solid #009246;
      display: flex;
      gap: 10px;
    }
    input { 
      flex: 1; 
      padding: 11px 16px; 
      border: 2px solid #eee;
      border-radius: 25px; 
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #e8001c; }
    button { 
      padding: 11px 22px; 
      background: #e8001c;
      color: white; 
      border: none; 
      border-radius: 25px; 
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.1s, background 0.2s;
      box-shadow: 0 4px 15px rgba(232,0,28,0.3);
    }
    button:hover { background: #009246; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .dsgvo {
      font-size: 11px;
      color: #aaa;
      text-align: center;
      padding: 8px 20px;
      background: #f8f9fa;
      border-top: 1px solid #eee;
    }
    .dsgvo a { color: #e8001c; text-decoration: none; }
@media (max-width: 480px) {
  body { 
    padding: 0; 
    align-items: stretch;
    background: white;
  }
  .container { 
    border-radius: 0; 
    max-width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .italian-stripe { display: none; }
  #chat { 
    flex: 1;
    height: auto;
  }
  .header h1 { font-size: 16px; }
  button { padding: 11px 14px; font-size: 13px; }
  input { font-size: 16px; }
}}</style>
</head>
<body>
  <div class="container">
    <div class="italian-stripe"></div>
    <div class="header">
      <div class="header-icon">🍕</div>
      <div>
        <h1 id="shop-title">La Pizza Mannheim Support</h1>
        <p><span class="online-dot"></span>Online — Antwortet sofort</p>
      </div>
    </div>
    <div id="chat">
      <div class="agent">
        <div class="agent-avatar">🍕</div>
        <span>Ciao! Herzlich willkommen bei La Pizza Mannheim! 🇮🇹 Wie kann ich dir helfen?</span>
      </div>
    </div>
    <div class="input-area">
      <input id="input" type="text" placeholder="Schreib eine Nachricht..." onkeydown="if(event.key==='Enter')send()" />
      <button onclick="send()">Senden ➤</button>
    </div>
    <div class="dsgvo">
      🔒 KI-gestützter Chat · Nachrichten werden nicht dauerhaft gespeichert ·
      <a href="https://lapizza-ma.de/datenschutz" target="_blank">Datenschutz</a>
    </div>
    <div class="italian-stripe"></div>
  </div>
  <script>
    const sessionId = Math.random().toString(36).substring(2);
    fetch('/config').then(r => r.json()).then(c => {
      document.getElementById('shop-title').textContent = c.name + ' Support';
    });
    async function send() {
      const input = document.getElementById('input');
      const chat = document.getElementById('chat');
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      chat.innerHTML += `<div class="user"><span>${message}</span></div>`;
      chat.innerHTML += `
        <div class="agent" id="loading">
          <div class="agent-avatar">🍕</div>
          <span class="typing"><span></span><span></span><span></span></span>
        </div>`;
      chat.scrollTop = chat.scrollHeight;
      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, sessionId })
        });
        const data = await res.json();
        document.getElementById('loading').remove();
        chat.innerHTML += `<div class="agent"><div class="agent-avatar">🍕</div><span>${data.reply}</span></div>`;
      } catch(e) {
        document.getElementById('loading').remove();
        chat.innerHTML += `<div class="agent"><div class="agent-avatar">🍕</div><span>Entschuldigung, da ist etwas schiefgelaufen. Bitte versuche es nochmal.</span></div>`;
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
